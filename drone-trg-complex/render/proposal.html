  g.fillStyle = '#01411c'; g.beginPath(); g.arc(cx + 48, cy - 42, 160, 0, 7); g.fill();
  g.save(); g.translate(cx + 100, cy - 88); g.rotate(0.6); g.fillStyle = '#fff'; g.beginPath();

const demarc = new THREE.Group(); extra.add(demarc);
{

  const f = new THREE.Mesh(new THREE.BoxGeometry(1.4, 1.4, 0.6), concrete([])); f.position.set(x, y, -0.3); f.castShadow = f.receiveShadow = true; footings.add(f);
  const c = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.34, h), concCol); c.position.set(x, y, h / 2); c.castShadow = true; columns.add(c);
}
const crane = new THREE.Group(); extra.add(crane);
{
  const y = new THREE.MeshStandardMaterial({ color: 0xf2b705, roughness: 0.6, metalness: 0.3 });
  const mast = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.6, 30), y); mast.position.set(0, 0, 15); crane.add(mast);

  const jib = new THREE.Group(); jib.position.set(0, 0, 30); crane.add(jib); crane.userData.jib = jib;
  const arm = new THREE.Mesh(new THREE.BoxGeometry(42, 1.2, 1.4), y); arm.position.set(12, 0, 0.7); jib.add(arm);
  const cw = new THREE.Mesh(new THREE.BoxGeometry(4, 2.4, 2.2), new THREE.MeshStandardMaterial({ color: 0x555555 })); cw.position.set(-7, 0, 0); jib.add(cw);
  const cab = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2, 2.2), y); cab.position.set(1.8, 0, -1.2); jib.add(cab);
  const hook = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 18, 6), new THREE.MeshStandardMaterial({ color: 0x222222 })); hook.rotation.x = Math.PI / 2; hook.position.set(22, 0, -9); jib.add(hook);
  crane.traverse(m => { if (m.isMesh) m.castShadow = true; });
  crane.position.set(-6, -26, 0);
}
// dust for earthwork / spin-up
const dustN = 1600, dpos = new Float32Array(dustN * 3), dseed = [];
for (let i = 0; i < dustN; i++) dseed.push([Math.random() * 110 - 55, Math.random() * 92 - 40, Math.random(), 0.5 + Math.random()]);
const dustGeo = new THREE.BufferGeometry(); dustGeo.setAttribute('position', new THREE.BufferAttribute(dpos, 3));
const dustMat = new THREE.PointsMaterial({ color: 0xd9c49e, size: 0.5, transparent: true, opacity: 0, depthWrite: false });
const dust = new THREE.Points(dustGeo, dustMat); dust.frustumCulled = false; extra.add(dust);

/* ---------------- sky & light ---------------- */
{
  const geo = new THREE.SphereGeometry(30000, 48, 24), cols = [];
  const top = new THREE.Color(0x5d8fc4), mid = new THREE.Color(0xa9c6df), hor = new THREE.Color(0xe8dcc6);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) { const t = Math.max(0, p.getY(i) / 30000); const c = t < 0.12 ? hor.clone().lerp(mid, t / 0.12) : mid.clone().lerp(top, Math.min(1, (t - 0.12) / 0.6)); cols.push(c.r, c.g, c.b); }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false })));
}
scene.fog = new THREE.Fog(0xdfd6c4, 4000, 26000);
scene.add(new THREE.HemisphereLight(0xcfe0f2, 0xa58d68, 0.75));
const sun = new THREE.DirectionalLight(0xfff0d8, 2.1);
const az = THREE.MathUtils.degToRad(meta.sun.azimuth), el = THREE.MathUtils.degToRad(meta.sun.elevation);
const sunDir = new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el));
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.04;
scene.add(sun); scene.add(sun.target);
function aimSun(center, r) { sun.position.copy(center).addScaledVector(sunDir, 400); sun.target.position.copy(center); const c = sun.shadow.camera; c.left = c.bottom = -r; c.right = c.top = r; c.near = 1; c.far = 1200; c.updateProjectionMatrix(); }
const ilights = [];
for (const [x, y] of [[-12, 4], [-12, -4], [-6, 0], [0.5, 4], [0.5, -5], [8, 3], [12, -3], [8, -8]]) { const l = new THREE.PointLight(0xfff1dc, 0.9, 16, 1.5); l.position.copy(E(x, y, 4.6)); scene.add(l); ilights.push(l); }

/* ---------------- overlays ---------------- */
const $ = s => document.querySelector(s);
const labelsEl = $('#labels'), labelEls = new Map();
const ray = new THREE.Raycaster();
function visibleChain(o) { while (o) { if (!o.visible) return false; o = o.parent; } return true; }
function occluded(p) {
  const dir = p.clone().sub(camera.position), dist = dir.length(); dir.normalize();
  ray.set(camera.position, dir); ray.far = dist - 0.6;
  const hits = ray.intersectObjects(rayTargets.filter(visibleChain), false);
  return hits.length > 0;
}
function drawLabels(list) {
  const W = renderer.domElement.width, H = renderer.domElement.height, seen = new Set();
  for (const L of list || []) {
    let el = labelEls.get(L.id);
    if (!el) { el = document.createElement('div'); el.className = 'lab'; el.innerHTML = `<div class="box"><div class="t"></div><div class="s"></div></div><div class="stem"></div><div class="dot"></div>`; labelsEl.appendChild(el); labelEls.set(L.id, el); }
    el.querySelector('.t').textContent = L.t; el.querySelector('.s').textContent = L.s || ''; el.querySelector('.s').hidden = !L.s;
    const p = E(...L.p), v = p.clone().project(camera);
    const on = v.z < 1 && Math.abs(v.x) < 1.05 && Math.abs(v.y) < 1.05 && !(L.occ !== false && occluded(p));
    el.style.left = ((v.x + 1) / 2 * W) + 'px'; el.style.top = ((1 - v.y) / 2 * H) + 'px';
    el.style.flexDirection = L.down ? 'column-reverse' : 'column'; el.style.transform = L.down ? 'translate(-50%, 0)' : 'translate(-50%, -100%)';
    el.style.opacity = on ? L.a : 0; seen.add(L.id);
  }
  for (const [id, el] of labelEls) if (!seen.has(id)) el.style.opacity = 0;
}
function setOverlay(o) {
  drawLabels(o.labels);
  const cap = $('#cap'); cap.hidden = !o.cap;
  if (o.cap) { cap.querySelector('.num').textContent = o.cap.n; cap.querySelector('.h').textContent = o.cap.h; cap.querySelector('.d').textContent = o.cap.d; cap.style.opacity = o.cap.a; cap.style.transform = `translateX(${(1 - o.cap.a) * -40}px)`; }
  const hdr = $('#hdr'); hdr.hidden = !o.hdr;
  if (o.hdr) { hdr.querySelector('.k').textContent = o.hdr.k; hdr.querySelector('.v').textContent = o.hdr.v; hdr.style.opacity = o.hdr.a; }
  $('#north').hidden = !o.north;
  const card = $('#card'); card.hidden = !o.card;
  if (o.card) {
    const c = o.card;
    card.querySelector('.sub').textContent = c.sub; card.querySelector('.sub2').textContent = c.sub2 || '';
    card.querySelector('.logoL').style.cssText = `opacity:${c.logo};transform:translateX(${(1 - c.logo) * -60}px) scale(${0.9 + 0.1 * c.logo})`;
    card.querySelector('.logoR').style.cssText = `opacity:${c.logo};transform:translateX(${(1 - c.logo) * 60}px) scale(${0.9 + 0.1 * c.logo})`;
    card.querySelector('.ttl').style.cssText = `opacity:${c.title};letter-spacing:${0.03 + (1 - c.title) * 0.12}em`;
    card.querySelector('.rule').style.width = (c.rule * 900) + 'px';
    card.querySelector('.sub').style.opacity = c.subA; card.querySelector('.sub2').style.opacity = c.subA;
  }
  $('#shade').style.background = o.shade ? `rgba(4,10,8,${o.shade})` : 'transparent';
}

/* ---------------- per-frame state ---------------- */
function setState(t, o) {
  const b = o.build;               // construction state (null = complete)
  const showAll = !b;
  const rpm = o.rpm === undefined ? 80 : o.rpm;
  for (const a of anims) a.obj.rotation.z = a.base + a.spin * (t * rpm / 60 * Math.PI * 2);
  blurMat.opacity = Math.min(0.14, rpm / 900);
  const blink = (Math.floor(t * 1.4) % 2) === 0;
  mats.Nav_Red.emissiveIntensity = blink ? 3.2 : 0.4; mats.Nav_Green.emissiveIntensity = blink ? 0.4 : 3.2;
  waveFlag(t);
  for (const g of groups.roof) g.visible = !o.noRoof && (showAll || b.hRoof > 5.31);
  for (const g of groups.interior) g.visible = !!(showAll || b.interior);
  for (const g of groups.road) g.visible = !!(showAll || b.road);
  for (const g of groups.pad) g.position.z = g.userData.base.z - 2.6 * (showAll ? 0 : 1 - b.pad);
  for (const g of groups.land) { const k = showAll ? 1 : b.land; g.visible = k > 0.001; g.scale.z = Math.max(k, 0.001); }
  for (const g of groups.core) { g.visible = !!(showAll || b.core > 0.001); g.position.z = g.userData.base.z + (showAll ? 0 : (1 - b.core) * 22); }
  const big = 1e4;
  P.finish.constant = showAll ? big : b.finish;
  P.above.constant = showAll ? -big : -b.finish;
  P.hShell.constant = showAll ? big : b.hShell;
  P.hRoof.constant = showAll ? big : b.hRoof;
  P.hCol.constant = showAll ? big : b.hCol;
  scene.traverse(m => { if (m.userData && m.userData.concrete) m.visible = !showAll; });
  for (const g of groups.shell) g.visible = !!(showAll || b.hShell > 0.01);
  footings.visible = !showAll && b.foot > 0.001; footings.scale.z = Math.max(b ? b.foot : 1, 0.001);
  columns.visible = !showAll && b.hCol > 0.05;
  crane.visible = !showAll && !!b.crane; if (crane.visible) crane.userData.jib.rotation.z = t * 0.35;
  demarc.visible = !!o.demarc;
  dustMat.opacity = 0.5 * (o.dust || 0);
  if (o.dust) for (let i = 0; i < dustN; i++) { const [x, y, h, s] = dseed[i]; dpos[i * 3] = x + Math.sin(t * s + h * 9) * 3; dpos[i * 3 + 1] = (0.2 + ((t * 0.4 * s + h) % 1) * 4); dpos[i * 3 + 2] = -(y + Math.cos(t * s + h * 7) * 3); }
  dustGeo.attributes.position.needsUpdate = true;
  for (const l of ilights) l.visible = !!o.interior;
  camera.fov = o.fov || 50; camera.near = o.near || 0.08; camera.updateProjectionMatrix();
  camera.position.copy(E(...o.eye)); camera.up.set(0, 1, 0); camera.lookAt(E(...o.look));
  if (o.roll) camera.rotateZ(o.roll);
  aimSun(E(...(o.shadowAt || o.look)), o.shadowR || 90);
  setOverlay(o);
}
function resize(w, h) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); document.body.style.width = w + 'px'; document.body.style.height = h + 'px'; }
resize(+(Q.get('w') || innerWidth), +(Q.get('h') || innerHeight));
window.R = { frame(t, o) { setState(t, o); renderer.render(scene, camera); return true; }, ready: true };
})();
