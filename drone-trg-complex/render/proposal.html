<script>
/* DRONE TRG COMPLEX - 44 DIV : proposal renderer (v3).
   Same design spec as the SketchUp model (build/spec.json). ENU metres (x east, y north, z up) inside `world`,
   rotated into three.js y-up space. Adds world-space (triplanar) material textures, environment reflections,
   a staged construction time-lapse, and DOM overlays (labels with leader lines, HUDs, title cards). */
(async function () {
const Q = new URLSearchParams(location.search);
const SS = +(Q.get('ss') || 1);          // supersampling factor (render at SS x, downscaled by the encoder)
const BASE = '../build/';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: SS < 1.4, preserveDrawingBuffer: true });
renderer.setPixelRatio(SS);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 16 / 9, 0.08, 90000);
const world = new THREE.Group(); world.rotation.x = -Math.PI / 2; scene.add(world);
const E = (x, y, z) => new THREE.Vector3(x, z, -y);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;

const [spec, meta] = await Promise.all([fetch(BASE + 'spec.json').then(r => r.json()), fetch(BASE + 'render_meta.json').then(r => r.json())]);
const loadF32 = async n => new Float32Array(await (await fetch(BASE + n)).arrayBuffer());
const [hNear, hFar, hHor] = await Promise.all([loadF32('terrain_near.f32'), loadF32('terrain_far.f32'), loadF32('terrain_horizon.f32')]);
const tl = new THREE.TextureLoader();
const tex = u => new Promise(res => tl.load(u, t => { t.encoding = THREE.sRGBEncoding; t.anisotropy = 16; res(t); }));
const [imgNear, imgFar, imgHor, pQuaid, pIqbal] = await Promise.all([tex(BASE + 'img_near.jpg'), tex(BASE + 'img_far.jpg'), tex(BASE + 'img_horizon.jpg'), tex('../assets/portrait_quaid.jpg'), tex('../assets/portrait_iqbal.jpg')]);
await document.fonts.ready;
for (const img of document.images) if (!img.complete) await new Promise(r => { img.onload = img.onerror = r; });

/* ---------------- procedural textures (seeded, deterministic) ---------------- */
let seed = 20261127;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
function canvasTex(size, draw) {
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d'); draw(g, size);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding; t.anisotropy = 16; return t;
}
function speckle(g, s, n, cols, a) { for (let i = 0; i < n; i++) { g.globalAlpha = a * rnd(); g.fillStyle = cols[(rnd() * cols.length) | 0]; g.fillRect(rnd() * s, rnd() * s, 1 + rnd() * 2, 1 + rnd() * 2); } g.globalAlpha = 1; }
function shadeHex(hex, k) { const n = parseInt(hex.slice(1), 16); const f = v => Math.max(0, Math.min(255, Math.round(v * k))); return `rgb(${f(n >> 16)},${f(n >> 8 & 255)},${f(n & 255)})`; }
const T = {
  ashlar: canvasTex(512, (g, s) => {            // coursed stone: 8 courses per tile, staggered blocks, recessed joints
    const rows = 8, rh = s / rows;
    for (let r = 0; r < rows; r++) { let x = -rnd() * 90; while (x < s) { const bw = 80 + rnd() * 110; g.fillStyle = shadeHex('#e8e2d4', 0.9 + rnd() * 0.12); g.fillRect(x, r * rh, bw, rh); g.fillStyle = 'rgba(70,58,40,.55)'; g.fillRect(x, r * rh, 2, rh); x += bw; } g.fillStyle = 'rgba(70,58,40,.6)'; g.fillRect(0, r * rh, s, 2.5); g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(0, r * rh + 3, s, 1); }
    speckle(g, s, 14000, ['#6b5a43', '#ffffff', '#9a8669'], 0.32);
  }),
  plaster: canvasTex(256, (g, s) => { g.fillStyle = '#f2efe8'; g.fillRect(0, 0, s, s); speckle(g, s, 5000, ['#d6d0c2', '#ffffff'], 0.22); }),
  tile600: canvasTex(512, (g, s) => { const n = 4, ts = s / n; for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { g.fillStyle = shadeHex('#efede8', 0.95 + rnd() * 0.06); g.fillRect(i * ts, j * ts, ts, ts); for (let k = 0; k < 6; k++) { g.strokeStyle = 'rgba(160,150,135,.12)'; g.beginPath(); g.moveTo(i * ts + rnd() * ts, j * ts); g.bezierCurveTo(i * ts + rnd() * ts, j * ts + ts / 3, i * ts + rnd() * ts, j * ts + ts / 2, i * ts + rnd() * ts, j * ts + ts); g.stroke(); } } g.fillStyle = '#b9b2a4'; for (let i = 0; i <= n; i++) { g.fillRect(i * ts - 1.5, 0, 3, s); g.fillRect(0, i * ts - 1.5, s, 3); } }),
  tile300: canvasTex(256, (g, s) => { const n = 4, ts = s / n; for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { g.fillStyle = shadeHex('#d9e6ea', 0.96 + rnd() * 0.05); g.fillRect(i * ts, j * ts, ts, ts); } g.fillStyle = '#9fb0b5'; for (let i = 0; i <= n; i++) { g.fillRect(i * ts - 1, 0, 2, s); g.fillRect(0, i * ts - 1, s, 2); } }),
  concrete: canvasTex(512, (g, s) => { g.fillStyle = '#d7d5cf'; g.fillRect(0, 0, s, s); for (let i = 0; i < 40; i++) { g.globalAlpha = 0.06; g.fillStyle = rnd() < 0.5 ? '#9a978f' : '#ffffff'; g.beginPath(); g.arc(rnd() * s, rnd() * s, 20 + rnd() * 80, 0, 7); g.fill(); } g.globalAlpha = 1; speckle(g, s, 16000, ['#8f8c85', '#ffffff', '#b5b2ab'], 0.35); g.fillStyle = 'rgba(90,88,82,.35)'; g.fillRect(0, s / 2, s, 1.5); g.fillRect(s / 2, 0, 1.5, s); }),
  gravel: canvasTex(512, (g, s) => { g.fillStyle = '#efe3c8'; g.fillRect(0, 0, s, s); speckle(g, s, 30000, ['#b39a73', '#fff7e6', '#8d7a5c', '#d9c4a0'], 0.55); }),
  lawn: canvasTex(512, (g, s) => { for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#a8b98a' : '#b4c494'; g.fillRect(i * s / 8, 0, s / 8, s); } speckle(g, s, 30000, ['#6f8452', '#d6dcb8', '#5b6e42', '#9a8a62'], 0.55); }),
  asphalt: canvasTex(512, (g, s) => { g.fillStyle = '#9a9a9c'; g.fillRect(0, 0, s, s); speckle(g, s, 30000, ['#5c5c5e', '#cfcfd1', '#77777a'], 0.6); }),
  carpet: canvasTex(256, (g, s) => { g.fillStyle = '#f0f0f0'; g.fillRect(0, 0, s, s); speckle(g, s, 14000, ['#c8c8c8', '#ffffff', '#a8a8a8'], 0.45); }),
  fabric: canvasTex(128, (g, s) => { g.fillStyle = '#f2f2f2'; g.fillRect(0, 0, s, s); for (let i = 0; i < s; i += 2) { g.fillStyle = 'rgba(0,0,0,.06)'; g.fillRect(i, 0, 1, s); g.fillRect(0, i, s, 1); } }),
  wood: canvasTex(512, (g, s) => { g.fillStyle = '#efe7dc'; g.fillRect(0, 0, s, s); for (let i = 0; i < 140; i++) { g.strokeStyle = rnd() < 0.5 ? 'rgba(90,60,30,.22)' : 'rgba(255,255,255,.18)'; g.lineWidth = 1 + rnd() * 2.5; const y = rnd() * s; g.beginPath(); g.moveTo(0, y); g.bezierCurveTo(s * .3, y + rnd() * 10 - 5, s * .7, y + rnd() * 10 - 5, s, y); g.stroke(); } for (let i = 0; i <= 4; i++) { g.fillStyle = 'rgba(60,40,20,.35)'; g.fillRect(0, i * s / 4, s, 1.5); } }),
};
// world-space triplanar mapping (no UVs needed; texture scale in metres per repeat)
function triplanar(mat, map, metres) {
  mat.map = map;
  mat.onBeforeCompile = sh => {
    sh.uniforms.triScale = { value: 1 / metres };
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vTriP; varying vec3 vTriN;')
      .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvTriP = (modelMatrix * vec4(transformed, 1.0)).xyz; vTriN = normalize(mat3(modelMatrix) * objectNormal);');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vTriP; varying vec3 vTriN; uniform float triScale;')
      .replace('#include <map_fragment>', `
        vec3 tw = pow(abs(normalize(vTriN)), vec3(4.0)); tw /= (tw.x + tw.y + tw.z);
        vec4 tX = texture2D(map, vTriP.zy * triScale); vec4 tY = texture2D(map, vTriP.xz * triScale); vec4 tZ = texture2D(map, vTriP.xy * triScale);
        diffuseColor *= tX * tw.x + tY * tw.y + tZ * tw.z;`);
  };
  mat.customProgramCacheKey = () => 'tri' + metres;
  return mat;
}
const TEXMAP = { Stone: [T.ashlar, 2.4], Stone_Band: [T.ashlar, 2.4], Stone_Dark: [T.ashlar, 2.4], Plaster: [T.plaster, 2], Floor_Tile: [T.tile600, 2.4],
  Tile_Wet: [T.tile300, 1.2], Roof: [T.concrete, 6], Concrete: [T.concrete, 4], Sand_Field: [T.gravel, 3], Lawn: [T.lawn, 8], Asphalt: [T.asphalt, 3],
  Carpet: [T.carpet, 1], Seat_Fabric: [T.fabric, 0.25], Upholstery_Grey: [T.fabric, 0.25], Wood: [T.wood, 1.2], Stage_Wood: [T.wood, 1.6], Wood_Slat: [T.wood, 0.8], Curtain: [T.fabric, 0.3] };

/* ---------------- materials ---------------- */
const EMISSIVE = { Screen_Glow: 0.55, Led_Blue: 2.0, Nav_Red: 3.0, Nav_Green: 2.6, Light_Panel: 1.8, Title_Letters: 0.35, Screen_Off: 0.5 };
const screenTex = imgNear.clone(); screenTex.needsUpdate = true; screenTex.repeat.set(0.12, 0.07); screenTex.offset.set(0.47, 0.46);
const mats = {};
for (const [name, c] of Object.entries(spec.materials)) {
  const col = new THREE.Color(c[0] / 255, c[1] / 255, c[2] / 255).convertSRGBToLinear();
  const o = { color: col, roughness: 0.82, metalness: 0, envMapIntensity: 0.35 };
  if (/Metal|Aluminium|Carbon|Composite/.test(name)) { o.roughness = 0.38; o.metalness = name === 'Aluminium' ? 0.85 : 0.45; o.envMapIntensity = 0.9; }
  if (name === 'Frame_Gold') { o.roughness = 0.3; o.metalness = 0.9; o.envMapIntensity = 1.2; }
  if (/Glass|Mirror/.test(name)) { o.roughness = 0.04; o.metalness = 0.7; o.envMapIntensity = 1.4; }
  if (/Sanitary|Tile_Wet|Laminate|Cabinet|Fire_Red|Bin_Blue/.test(name)) { o.roughness = 0.25; o.envMapIntensity = 0.7; }
  if (/Leather/.test(name)) { o.roughness = 0.45; o.envMapIntensity = 0.6; }
  if (/Olive|Tyre/.test(name)) o.roughness = 0.7;
  if (c[3] < 255) { o.transparent = true; o.opacity = c[3] / 255; o.depthWrite = false; }
  if (EMISSIVE[name]) { o.emissive = col.clone(); o.emissiveIntensity = EMISSIVE[name]; }
  if (name === 'Screen_Glow' || name === 'Screen_Off') { o.map = screenTex; o.emissiveMap = screenTex; o.color = new THREE.Color(0.35, 0.4, 0.5); o.emissive = new THREE.Color(0.75, 0.85, 1.0); o.roughness = 0.25; }
  if (/^Portrait_/.test(name)) { o.map = name === 'Portrait_Quaid' ? pQuaid : pIqbal; o.color = new THREE.Color(1, 1, 1); o.roughness = 0.55; o.emissive = new THREE.Color(1, 1, 1); o.emissiveMap = o.map; o.emissiveIntensity = 0.28; }
  const m = new THREE.MeshStandardMaterial(o);
  if (TEXMAP[name]) triplanar(m, TEXMAP[name][0], TEXMAP[name][1]);
  mats[name] = m;

  padZ = b ? -2.6 * (1 - b.pad) : 0;
  const { dozer, exc, hoe, crane } = plantV;
  // spoil heaps grow with earthwork, shrink at finishes; brick stacks are consumed by masonry
  const heap = p < 1 ? 0 : p === 1 ? sm(u) : p < 7 ? 1 : 1 - sm(u * 1.4);
  site.userData.spoil.forEach(c => { c.visible = heap > 0.02; c.scale.set(0.4 + 0.6 * heap, heap, 0.4 + 0.6 * heap); c.position.z = onT(c.position.x, c.position.y) + c.userData.h * heap / 2; });
  site.userData.bricks.forEach((bk, i) => { bk.visible = !(p > 4 || (p === 4 && i < u * 10)); });
  surveyor.visible = p === 0;
  // dozer: clearing / grading passes across the pad, finishing the road at the end
  dozer.g.visible = true;
  { const lane = Math.floor(T * 0.5) % 5, k = tri(T * 0.25), fwd = Math.floor(T * 0.5) % 2 === 0;
    if (p <= 1) { const x = -30 + 60 * k, y = -20 + lane * 9; place(dozer, x, y, fwd ? 0 : Math.PI, T * 3.2, { blade: fwd ? -0.05 : 0.45 }); }
    else if (p < 7) place(dozer, 42, -24, Math.PI * 0.75, 0, { blade: 0.2 });
    else { const x = -40 + 36 * tri(T * 0.2), y = 58.5; place(dozer, x, y, k < 0.5 ? 0 : Math.PI, T * 3, { blade: 0.0 }); } }
  // excavator: earthwork into the spoil heap, then footing trenches along the walls
  exc.g.visible = p < 7 || u < 0.5;
  if (p === 0) place(exc, -36, 18, -0.3, 0, { swing: 0.2, boom: 0.6, stick: 1.2, bucket: 0.9 });
  else if (p === 1) place(exc, 24, 14, 0.5, 0, digCycle(T * 0.55, 1.3, -0.6));
  else if (p === 2) { const x = -16 + 32 * sm(u); place(exc, x, -22, 0, 1.0 * x, digCycle(T * 0.6, -1.4, 1.5)); }
  else if (p < 7) place(exc, 34, 24, -2.2, 0, { swing: 0.4, boom: 0.55, stick: 1.3, bucket: 1.0 });
  else { const pth = VEH.along([[34, 24], [30, 44], [10, 48], [2, 58], [-30, 60]]); const [x, y, h] = pth.at(u * 2 * pth.L); place(exc, x, y, h, u * 2 * pth.L, { boom: 0.6, stick: 1.3, bucket: 1.0 }); }
  // backhoe loader: shuttles between the material yard and the works
  { const route = p < 3 ? [[-34, -20], [-26, -12], [-24, 0], [-26, 10]] : p < 7 ? [[-30, -30], [-22, -22], [-10, -19], [2, -19]] : [[16, 30], [20, 38], [-14, 40], [-20, 30]];
    const pth = VEH.along(route), k = tri(T * 0.18), d = k * pth.L, [x, y, h0] = pth.at(d), back = (T * 0.18) % 1 > 0.5;
    place(hoe, x, y, h0 + (back ? Math.PI : 0), T * 4 * (back ? -1 : 1), { lift: back ? 0.15 : 0.55, tip: back ? 0 : 0.35, hoeBoom: 0.2, hoeDip: 0.6, hoeBucket: 1.0, stab: 0 }); }
  // mobile crane: drives in for the frame, lifts cages / bricks / rotor pods, stows and drives out
  const craneOn = p >= 3 && (p < 7 || u < 0.55);
  crane.g.visible = craneOn; craneLoad.visible = false;
  if (craneOn) {
    const cx = 2, cy = -27;
    if (p === 3 && u < 0.22) { const k = sm(u / 0.22), pth = VEH.along([[-60, -36], [-20, -33], [cx, cy]]); const [x, y, h] = pth.at(k * pth.L); place(crane, x, y, h, k * pth.L, { outrig: 0, luff: 0.02, extend: 0, hookDrop: 1.5 }); }
    else if (p === 7) { const k = sm(u / 0.55), stow = sm(k * 2.5), drive = sm((k - 0.4) / 0.6); const pth = VEH.along([[cx, cy], [30, -34], [70, -40]]); const [x, y, h] = pth.at(drive * pth.L);
      place(crane, x, y, h, drive * pth.L, { outrig: 1 - stow, luff: 0.55 * (1 - stow) + 0.02, extend: 0.5 * (1 - stow), slew: 0, hookDrop: 2 }); }
    else {
      const set = p === 3 ? sm((u - 0.22) / 0.12) : 1, cyc = ((T * 0.33) % 1 + 1) % 1, L = (a, bb, k) => a + (bb - a) * sm(k);
      const yardA = 3.1, bldA = p === 6 ? 1.7 : 1.5; let slew, drop, loaded;
      if (cyc < 0.15) { slew = yardA; drop = L(6, 15, cyc / 0.15); loaded = cyc > 0.1; }
      else if (cyc < 0.5) { const k = (cyc - 0.15) / 0.35; slew = L(yardA, bldA, k); drop = L(15, 4, Math.min(1, k * 2)); loaded = true; }
      else if (cyc < 0.65) { slew = bldA; drop = L(4, p >= 5 ? 6 : 9, (cyc - 0.5) / 0.15); loaded = cyc < 0.6; }
      else { slew = L(bldA, yardA, (cyc - 0.65) / 0.35); drop = L(9, 6, (cyc - 0.65) / 0.35); loaded = false; }
      place(crane, cx, cy, 0, 0, { outrig: set, luff: 0.02 + 0.6 * set, extend: 0.55 * set, slew: set < 1 ? 0 : slew, hookDrop: set < 1 ? 2 : drop });
      if (set >= 1 && loaded) { craneLoad.visible = true; crane.hook.getWorldPosition(hookW); plant.worldToLocal(hookW); craneLoad.position.copy(hookW); craneLoad.rotation.z = slew;
        const kind = p === 3 ? 'cage' : p === 6 ? 'pod' : 'bricks'; craneLoad.children.forEach(c => { c.visible = c.userData.kind === kind; }); }
    }
  }
  // crew: walk their beats (time-lapse pace), some working at the face
  const crewOn = p < 7 ? 1 : 1 - u;
  crew.forEach((c, i) => { c.p.g.visible = i / crew.length < crewOn;
    const k = tri(T * 0.12 + c.ph * 0.1), d = k * c.path.L, [x, y, h] = c.path.at(d), back = ((T * 0.12 + c.ph * 0.1) % 1) > 0.5;
    c.p.g.position.set(x, y, Math.max(onT(x, y), 0) + b_pad_z(x, y)); c.p.g.rotation.z = h + (back ? Math.PI : 0);
    if (c.work && (k < 0.08 || k > 0.92)) c.p.work(T * 6 + c.ph); else c.p.walk(T * 11 + c.ph); });
  for (const v of Object.values(plantV)) v.g.position.z = Math.max(v.g.position.z, padZ * 0 + v.g.position.z);
}

/* ---------------- military vehicles (from the supplied photos): parked, or arriving as a convoy ---------------- */
const milG = new THREE.Group(); world.add(milG);
const milV = { pickup: VEH.pickup(4), mrap: VEH.mrap(), gcs: VEH.armyTruck(true), cargo: VEH.armyTruck(false) };
for (const v of Object.values(milV)) milG.add(v.g);
for (const n of ['Vehicle_1', 'Vehicle_2', 'GCS_Truck']) { const o = world.getObjectByName(n); if (o) o.visible = false; }
const convoyPath = VEH.along([[-330, 59.5], [-120, 59.5], [-16, 59.5], [-4, 57.5], [-2, 52], [-2, 36], [-6, 24], [-22, 20], [-34, 16], [-42, 11.5]]);
function animMil(t, o) {
  const put = (v, x, y, h, s, p) => { v.g.position.set(x, y, terrainH(x, y) + 0.02); v.g.rotation.z = h; v.set(Object.assign({ s }, p || {})); };
  put(milV.gcs, 22.5, -31.5, Math.PI / 2, 0); put(milV.cargo, -42, -4.5, 0, 0);
  if (o.convoy === undefined) { put(milV.pickup, -42, 11.5, 0, 0); put(milV.mrap, -42, 4.1, 0, 0, { turret: 0.4 }); return; }
  const d = o.convoy * convoyPath.L;
  const [x1, y1, h1] = convoyPath.at(d); put(milV.pickup, x1, y1, h1, d);
  const d2 = Math.max(0, d - 16), [x2, y2, h2] = convoyPath.at(d2); put(milV.mrap, x2, y2, h2, d2, { turret: Math.sin(t * 0.4) * 0.6 });
}

/* ---------------- post: HDR -> SAO -> bloom -> ACES + exposure + sharpen -> SMAA ---------------- */
const RW = 1920, RH = 1080;
const hdrRT = new THREE.WebGLRenderTarget(RW * SS, RH * SS, { type: THREE.HalfFloatType });
const composer = new THREE.EffectComposer(renderer, hdrRT); composer.setPixelRatio(SS); composer.setSize(RW, RH);
const aoCam = camera.clone();
composer.addPass(new THREE.RenderPass(scene, camera));
const sao = new THREE.SAOPass(scene, aoCam, false, true, new THREE.Vector2(RW * SS, RH * SS));
Object.assign(sao.params, { saoBias: 0.5, saoIntensity: 0.012, saoScale: 40, saoKernelRadius: 30, saoMinResolution: 0, saoBlur: true, saoBlurRadius: 6, saoBlurStdDev: 3, saoBlurDepthCutoff: 0.01 });
composer.addPass(sao);
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(RW * SS / 2, RH * SS / 2), 0.25, 0.55, 3.5); composer.addPass(bloom);
const exposure = { value: 1.0 };
const finalPass = new THREE.ShaderPass({ uniforms: { tDiffuse: { value: null }, uExp: exposure, uTexel: { value: new THREE.Vector2(1 / (RW * SS), 1 / (RH * SS)) }, uSharp: { value: 0.35 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float uExp, uSharp; uniform vec2 uTexel; varying vec2 vUv;
    vec3 aces(vec3 x){ x *= uExp * 0.6; const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14; return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0); }
    vec3 srgb(vec3 c){ return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }
    vec3 tm(vec2 uv){ return srgb(aces(texture2D(tDiffuse, uv).rgb)); }
    void main(){ vec3 c = tm(vUv); vec3 bl = (tm(vUv + vec2(uTexel.x, 0.0)) + tm(vUv - vec2(uTexel.x, 0.0)) + tm(vUv + vec2(0.0, uTexel.y)) + tm(vUv - vec2(0.0, uTexel.y))) * 0.25;
      c = c + (c - bl) * uSharp; vec2 q = vUv - 0.5; c *= 1.0 - 0.22 * dot(q, q); gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0); }` });
composer.addPass(finalPass);
const smaa = new THREE.SMAAPass(RW * SS, RH * SS); composer.addPass(smaa);
renderer.toneMapping = THREE.NoToneMapping;
collectMats();
function resize(w, h) { renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
resize(RW, RH);
window.R = { frame(t, o) { setState(t, o); composer.render(); return true }, ready: true };
})();
