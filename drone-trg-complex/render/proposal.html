<script>
/* DRONE TRG COMPLEX - 44 DIV : proposal renderer (v3).
   Same design spec as the SketchUp model (build/spec.json). ENU metres (x east, y north, z up) inside `world`,
   rotated into three.js y-up space. Adds world-space (triplanar) material textures, environment reflections,
   a staged construction time-lapse, and DOM overlays (labels with leader lines, HUDs, title cards). */
(async function () {
const Q = new URLSearchParams(location.search);
const SS = +(Q.get('ss') || 1);          // supersampling factor (render at SS x, downscaled by the encoder)
const BASE = '../build/';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: SS < 1.4, preserveDrawingBuffer: true });

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 16 / 9, 0.08, 40000);
const world = new THREE.Group(); world.rotation.x = -Math.PI / 2; scene.add(world);
const E = (x, y, z) => new THREE.Vector3(x, z, -y);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;

const [spec, meta] = await Promise.all([fetch(BASE + 'spec.json').then(r => r.json()), fetch(BASE + 'render_meta.json').then(r => r.json())]);
const loadF32 = async n => new Float32Array(await (await fetch(BASE + n)).arrayBuffer());
const [hNear, hFar] = await Promise.all([loadF32('terrain_near.f32'), loadF32('terrain_far.f32')]);
const tl = new THREE.TextureLoader();
const tex = u => new Promise(res => tl.load(u, t => { t.encoding = THREE.sRGBEncoding; t.anisotropy = 16; res(t); }));
const [imgNear, imgFar, pQuaid, pIqbal] = await Promise.all([tex(BASE + 'img_near.jpg'), tex(BASE + 'img_far.jpg'), tex('../assets/portrait_quaid.jpg'), tex('../assets/portrait_iqbal.jpg')]);

for (const img of document.images) if (!img.complete) await new Promise(r => { img.onload = img.onerror = r; });

/* ---------------- procedural textures (seeded, deterministic) ---------------- */
let seed = 20261127;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
function canvasTex(size, draw) {

  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.encoding = THREE.sRGBEncoding; t.anisotropy = 16; return t;
}
function speckle(g, s, n, cols, a) { for (let i = 0; i < n; i++) { g.globalAlpha = a * rnd(); g.fillStyle = cols[(rnd() * cols.length) | 0]; g.fillRect(rnd() * s, rnd() * s, 1 + rnd() * 2, 1 + rnd() * 2); } g.globalAlpha = 1; }

const T = {
  ashlar: canvasTex(512, (g, s) => {            // coursed stone: 8 courses per tile, staggered blocks, recessed joints
    const rows = 8, rh = s / rows;
    for (let r = 0; r < rows; r++) { let x = -rnd() * 90; while (x < s) { const bw = 80 + rnd() * 110; g.fillStyle = shadeHex('#e8e2d4', 0.9 + rnd() * 0.12); g.fillRect(x, r * rh, bw, rh); g.fillStyle = 'rgba(70,58,40,.55)'; g.fillRect(x, r * rh, 2, rh); x += bw; } g.fillStyle = 'rgba(70,58,40,.6)'; g.fillRect(0, r * rh, s, 2.5); g.fillStyle = 'rgba(255,255,255,.25)'; g.fillRect(0, r * rh + 3, s, 1); }
    speckle(g, s, 14000, ['#6b5a43', '#ffffff', '#9a8669'], 0.32);
  }),
  plaster: canvasTex(256, (g, s) => { g.fillStyle = '#f2efe8'; g.fillRect(0, 0, s, s); speckle(g, s, 5000, ['#d6d0c2', '#ffffff'], 0.22); }),
  tile600: canvasTex(512, (g, s) => { const n = 4, ts = s / n; for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { g.fillStyle = shadeHex('#efede8', 0.95 + rnd() * 0.06); g.fillRect(i * ts, j * ts, ts, ts); for (let k = 0; k < 6; k++) { g.strokeStyle = 'rgba(160,150,135,.12)'; g.beginPath(); g.moveTo(i * ts + rnd() * ts, j * ts); g.bezierCurveTo(i * ts + rnd() * ts, j * ts + ts / 3, i * ts + rnd() * ts, j * ts + ts / 2, i * ts + rnd() * ts, j * ts + ts); g.stroke(); } } g.fillStyle = '#b9b2a4'; for (let i = 0; i <= n; i++) { g.fillRect(i * ts - 1.5, 0, 3, s); g.fillRect(0, i * ts - 1.5, s, 3); } }),
  tile300: canvasTex(256, (g, s) => { const n = 4, ts = s / n; for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { g.fillStyle = shadeHex('#d9e6ea', 0.96 + rnd() * 0.05); g.fillRect(i * ts, j * ts, ts, ts); } g.fillStyle = '#9fb0b5'; for (let i = 0; i <= n; i++) { g.fillRect(i * ts - 1, 0, 2, s); g.fillRect(0, i * ts - 1, s, 2); } }),
  concrete: canvasTex(512, (g, s) => { g.fillStyle = '#d7d5cf'; g.fillRect(0, 0, s, s); for (let i = 0; i < 40; i++) { g.globalAlpha = 0.06; g.fillStyle = rnd() < 0.5 ? '#9a978f' : '#ffffff'; g.beginPath(); g.arc(rnd() * s, rnd() * s, 20 + rnd() * 80, 0, 7); g.fill(); } g.globalAlpha = 1; speckle(g, s, 16000, ['#8f8c85', '#ffffff', '#b5b2ab'], 0.35); g.fillStyle = 'rgba(90,88,82,.35)'; g.fillRect(0, s / 2, s, 1.5); g.fillRect(s / 2, 0, 1.5, s); }),
  gravel: canvasTex(512, (g, s) => { g.fillStyle = '#efe3c8'; g.fillRect(0, 0, s, s); speckle(g, s, 30000, ['#b39a73', '#fff7e6', '#8d7a5c', '#d9c4a0'], 0.55); }),
  lawn: canvasTex(512, (g, s) => { for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#7fc463' : '#94d276'; g.fillRect(i * s / 8, 0, s / 8, s); } speckle(g, s, 26000, ['#4f9a3d', '#b8e59a', '#3e7f2e'], 0.5); }),
  asphalt: canvasTex(512, (g, s) => { g.fillStyle = '#9a9a9c'; g.fillRect(0, 0, s, s); speckle(g, s, 30000, ['#5c5c5e', '#cfcfd1', '#77777a'], 0.6); }),
  carpet: canvasTex(256, (g, s) => { g.fillStyle = '#f0f0f0'; g.fillRect(0, 0, s, s); speckle(g, s, 14000, ['#c8c8c8', '#ffffff', '#a8a8a8'], 0.45); }),
  fabric: canvasTex(128, (g, s) => { g.fillStyle = '#f2f2f2'; g.fillRect(0, 0, s, s); for (let i = 0; i < s; i += 2) { g.fillStyle = 'rgba(0,0,0,.06)'; g.fillRect(i, 0, 1, s); g.fillRect(0, i, s, 1); } }),
  wood: canvasTex(512, (g, s) => { g.fillStyle = '#efe7dc'; g.fillRect(0, 0, s, s); for (let i = 0; i < 140; i++) { g.strokeStyle = rnd() < 0.5 ? 'rgba(90,60,30,.22)' : 'rgba(255,255,255,.18)'; g.lineWidth = 1 + rnd() * 2.5; const y = rnd() * s; g.beginPath(); g.moveTo(0, y); g.bezierCurveTo(s * .3, y + rnd() * 10 - 5, s * .7, y + rnd() * 10 - 5, s, y); g.stroke(); } for (let i = 0; i <= 4; i++) { g.fillStyle = 'rgba(60,40,20,.35)'; g.fillRect(0, i * s / 4, s, 1.5); } }),
};
// world-space triplanar mapping (no UVs needed; texture scale in metres per repeat)
function triplanar(mat, map, metres) {
  mat.map = map;
  mat.onBeforeCompile = sh => {
    sh.uniforms.triScale = { value: 1 / metres };
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vTriP; varying vec3 vTriN;')
      .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvTriP = (modelMatrix * vec4(transformed, 1.0)).xyz; vTriN = normalize(mat3(modelMatrix) * objectNormal);');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vTriP; varying vec3 vTriN; uniform float triScale;')
      .replace('#include <map_fragment>', `
        vec3 tw = pow(abs(normalize(vTriN)), vec3(4.0)); tw /= (tw.x + tw.y + tw.z);
        vec4 tX = texture2D(map, vTriP.zy * triScale); vec4 tY = texture2D(map, vTriP.xz * triScale); vec4 tZ = texture2D(map, vTriP.xy * triScale);
        diffuseColor *= tX * tw.x + tY * tw.y + tZ * tw.z;`);
  };
  mat.customProgramCacheKey = () => 'tri' + metres;
  return mat;
}
const TEXMAP = { Stone: [T.ashlar, 2.4], Stone_Band: [T.ashlar, 2.4], Stone_Dark: [T.ashlar, 2.4], Plaster: [T.plaster, 2], Floor_Tile: [T.tile600, 2.4],
  Tile_Wet: [T.tile300, 1.2], Roof: [T.concrete, 6], Concrete: [T.concrete, 4], Sand_Field: [T.gravel, 3], Lawn: [T.lawn, 8], Asphalt: [T.asphalt, 3],
  Carpet: [T.carpet, 1], Seat_Fabric: [T.fabric, 0.25], Upholstery_Grey: [T.fabric, 0.25], Wood: [T.wood, 1.2], Stage_Wood: [T.wood, 1.6], Wood_Slat: [T.wood, 0.8], Curtain: [T.fabric, 0.3] };

/* ---------------- materials ---------------- */
const EMISSIVE = { Screen_Glow: 0.55, Led_Blue: 2.0, Nav_Red: 3.0, Nav_Green: 2.6, Light_Panel: 1.8, Title_Letters: 0.35, Screen_Off: 0.5 };
const screenTex = imgNear.clone(); screenTex.needsUpdate = true; screenTex.repeat.set(0.12, 0.07); screenTex.offset.set(0.47, 0.46);
const mats = {};
for (const [name, c] of Object.entries(spec.materials)) {
  const col = new THREE.Color(c[0] / 255, c[1] / 255, c[2] / 255).convertSRGBToLinear();
  const o = { color: col, roughness: 0.82, metalness: 0, envMapIntensity: 0.35 };
  if (/Metal|Aluminium|Carbon|Composite/.test(name)) { o.roughness = 0.38; o.metalness = name === 'Aluminium' ? 0.85 : 0.45; o.envMapIntensity = 0.9; }
  if (name === 'Frame_Gold') { o.roughness = 0.3; o.metalness = 0.9; o.envMapIntensity = 1.2; }
  if (/Glass|Mirror/.test(name)) { o.roughness = 0.04; o.metalness = 0.7; o.envMapIntensity = 1.4; }
  if (/Sanitary|Tile_Wet|Laminate|Cabinet|Fire_Red|Bin_Blue/.test(name)) { o.roughness = 0.25; o.envMapIntensity = 0.7; }
  if (/Leather/.test(name)) { o.roughness = 0.45; o.envMapIntensity = 0.6; }
  if (/Olive|Tyre/.test(name)) o.roughness = 0.7;
  if (c[3] < 255) { o.transparent = true; o.opacity = c[3] / 255; o.depthWrite = false; }
  if (EMISSIVE[name]) { o.emissive = col.clone(); o.emissiveIntensity = EMISSIVE[name]; }
  if (name === 'Screen_Glow' || name === 'Screen_Off') { o.map = screenTex; o.emissiveMap = screenTex; o.color = new THREE.Color(0.35, 0.4, 0.5); o.emissive = new THREE.Color(0.75, 0.85, 1.0); o.roughness = 0.25; }
  if (/^Portrait_/.test(name)) { o.map = name === 'Portrait_Quaid' ? pQuaid : pIqbal; o.color = new THREE.Color(1, 1, 1); o.roughness = 0.55; o.emissive = new THREE.Color(1, 1, 1); o.emissiveMap = o.map; o.emissiveIntensity = 0.28; }
  const m = new THREE.MeshStandardMaterial(o);
  if (TEXMAP[name]) triplanar(m, TEXMAP[name][0], TEXMAP[name][1]);
  mats[name] = m;
}
// construction clipping planes (three.js world space, y up)
const P = { finish: new THREE.Plane(new THREE.Vector3(0, -1, 0), 1e4), above: new THREE.Plane(new THREE.Vector3(0, 1, 0), -1e4),
            hShell: new THREE.Plane(new THREE.Vector3(0, -1, 0), 1e4), hRoof: new THREE.Plane(new THREE.Vector3(0, -1, 0), 1e4),
            hCol: new THREE.Plane(new THREE.Vector3(0, -1, 0), 1e4), hBar: new THREE.Plane(new THREE.Vector3(0, -1, 0), 1e4),
